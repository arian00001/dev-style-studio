name: Mail probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call the real reply composer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import autoreply
          print("MODELS:", autoreply.candidate_models())
          print("REPLY:", autoreply.gemini("Write two friendly lines replying to an email asking about pricing."))
          PY
