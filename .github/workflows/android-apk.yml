name: Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Published app URL the APK loads
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
        run: gradle assembleDebug -PappUrl="${APP_URL}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
