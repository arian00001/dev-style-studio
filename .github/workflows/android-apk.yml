name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the app is native (no browser engine)
        run: |
          if grep -rn "android\\.webkit\\|WebViewClient\\|new WebView(" android/app/src/main; then
            echo "::error::The Android sources still use the system browser engine."
            exit 1
          fi
          echo "Native screens only - no browser engine in the sources."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT" ]; then SDK="$ANDROID_SDK_ROOT"; elif [ -d "$ANDROID_HOME" ]; then SDK="$ANDROID_HOME"; else SDK=/usr/local/lib/android/sdk; fi
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Collect and verify APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/dev-style-studio.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose dist/dev-style-studio.apk
            "$APKSIGNER" print-certs dist/dev-style-studio.apk | grep -i "SHA-256" || true
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-apk
          path: dist/dev-style-studio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Dev Style Studio APK ${{ github.run_number }}
          body: |
            Signed release APK (native Android, no browser engine) from ${{ github.sha }}
          files: dist/dev-style-studio.apk
