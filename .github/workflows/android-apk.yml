name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Published app URL the APK loads (https://...)
        required: false

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app URL
        id: url
        env:
          INPUT_URL: ${{ inputs.app_url }}
          DEFAULT_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$INPUT_URL" ]; then URL="$INPUT_URL"; else URL="$DEFAULT_URL"; fi
          if [ -z "$URL" ]; then
            echo "::warning::No app URL was provided, so the APK will open with an information screen. Pass the app_url input or set the APP_URL repository variable."
          fi
          echo "app_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          APP_URL: ${{ steps.url.outputs.app_url }}
        run: gradle assembleDebug --no-daemon -PappUrl="$APP_URL"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/dev-style-studio.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-studio-apk
          path: dist/dev-style-studio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: |
            Debug APK built from ${{ github.sha }}
            App URL loaded: ${{ steps.url.outputs.app_url }}
          files: dist/dev-style-studio.apk
