plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devstyle.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.devstyle.studio'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '3.1'
    }

    signingConfigs {
        release {
            storeFile file('devstyle-release.p12')
            storeType 'PKCS12'
            storePassword 'devstyle2026'
            keyAlias 'devstyle'
            keyPassword 'devstyle2026'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
                'META-INF/NOTICE.md',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/NOTICE',
                'META-INF/INDEX.LIST'
            ]
        }
    }
}

dependencies {
    // AndroidX pulls Kotlin stdlib jdk7/jdk8; the BOM keeps them on one version so
    // their classes no longer collide with kotlin-stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // IMAP / SMTP for the 24/7 inbox monitor and auto-reply.
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}